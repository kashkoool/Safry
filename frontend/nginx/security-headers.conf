# Security headers for every response nginx produces itself (HTML, JS, CSS, errors).
# nginx drops inherited add_header directives in any block that declares its own, so every
# location that uses add_header must include this file again.
# CSP: the SPA loads only same-origin scripts, styles, images and API calls (no inline script,
# no third-party origins). Widen a directive only together with the code change that needs it.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), magnetometer=(), gyroscope=(), accelerometer=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
# Everything the SPA loads is same-origin (see the CSP above), so require-corp blocks nothing and keeps the page cross-origin isolatable.
add_header Cross-Origin-Embedder-Policy "require-corp" always;
# Sent only when the request reached the TLS terminator over HTTPS (see $safry_hsts in default.conf).
add_header Strict-Transport-Security $safry_hsts always;
