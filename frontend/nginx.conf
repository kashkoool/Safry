# The scheme the browser used: taken from the TLS terminator in front when there is one.
map $http_x_forwarded_proto $safry_forwarded_proto {
  default $http_x_forwarded_proto;
  ""      $scheme;
}
# HSTS only for HTTPS requests (browsers ignore it over plain HTTP anyway).
map $safry_forwarded_proto $safry_hsts {
  https   "max-age=31536000; includeSubDomains";
  default "";
}

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;
  include /etc/nginx/snippets/security-headers.conf;

  # Compression for text assets (hashed files under /assets are immutable, so this is paid once per client).
  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_vary on;
  gzip_types text/css application/javascript text/javascript application/json image/svg+xml text/plain;

  # Container healthcheck; not proxied, no logging.
  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  # The browser talks to one origin; /api goes to the backend container.
  location /api/ {
    proxy_pass http://api:3000;
    # Host with its port: the API compares it with the Origin header (same-origin CSRF check on the refresh cookie routes).
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $safry_forwarded_proto;
    client_max_body_size 5m;
    # Explicit upstream timeouts: fail fast on a dead API, bound slow responses.
    proxy_connect_timeout 5s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;
    # BREACH hygiene: token-bearing JSON must not be compressed. `gzip off` only stops nginx itself; the API
    # (backend app.setup.ts uses compression()) would still gzip when the client asks, so the client
    # Accept-Encoding is not forwarded and the API answers uncompressed. Static assets keep gzip.
    gzip off;
    proxy_set_header Accept-Encoding "";
    # One source of truth for security headers at the edge: drop helmet's copies, add ours.
    proxy_hide_header Content-Security-Policy;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header Cross-Origin-Opener-Policy;
    proxy_hide_header Cross-Origin-Resource-Policy;
    proxy_hide_header Cross-Origin-Embedder-Policy;
    proxy_hide_header Strict-Transport-Security;
    include /etc/nginx/snippets/security-headers.conf;
  }

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    include /etc/nginx/snippets/security-headers.conf;
    try_files $uri =404;
  }

  # Single-page app: unknown paths (for example /login/admin) serve index.html.
  location = /favicon.svg {
    expires 1d;
    add_header Cache-Control "public, max-age=86400";
    include /etc/nginx/snippets/security-headers.conf;
  }

  location / {
    add_header Cache-Control "no-cache";
    include /etc/nginx/snippets/security-headers.conf;
    try_files $uri /index.html;
  }
}
