# LOCAL ONLY (scripts/alerts-fire-test.sh). In a real deployment use the same job name and the same bearer-token scrape.
global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: safry-api
    metrics_path: /api/v1/metrics
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/metrics-token
    scrape_timeout: 4s
    static_configs:
      - targets: ["api:3000"]
