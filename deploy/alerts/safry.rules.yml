# Safry alert rules (Prometheus format, provider neutral).
# Plain-language guide, first actions and the Azure Monitor mapping: docs/ALERTING.md.
# Tested with: scripts/alerts-test.sh (promtool unit tests in safry.rules.test.yml).
#
# Scrape job name expected: "safry-api". The API serves /metrics only when METRICS_TOKEN is set and the caller sends it as a bearer token.
# Severity: "page" = wake a human now; "ticket" = look during working hours.
# Every threshold below is a starting point for a small product: tune it from real traffic (see "How to tune" in docs/ALERTING.md).
# Metric names come from backend/src/common/http/metrics.ts. Route labels are templates (no ids); status is a class (2xx, 4xx, 5xx).

groups:
  - name: safry-availability
    rules:
      - alert: ApiDown
        # The scrape failed for 2 minutes, or the target is not configured at all (absent).
        # Tune: raise "for" if the platform restarts instances slowly.
        expr: up{job="safry-api"} == 0 or absent(up{job="safry-api"})
        for: 2m
        labels:
          severity: page
        annotations:
          summary: "Safry API cannot be scraped"
          description: "Prometheus has not been able to read /metrics from the API for 2 minutes. The API may be down, unreachable, or the scrape token may be wrong (a rejected token also shows as down)."
          first_action: "Open the platform health page for the API; check the container or app is running and the last deploy; then check /api/v1/health/live from outside. If /metrics answers 401, the scraper token is missing or does not match (for example after a rotation)."
          runbook: "docs/ALERTING.md#apidown"

      - alert: ProcessRestarting
        # The API process started more than 2 times in 15 minutes (a crash loop: the process handlers exit on an unhandled rejection or
        # uncaught exception, and the platform restarts it). Uses the process start time exported at /metrics; each restart changes it.
        # Counts restarts of a target with a stable address (one scrape target per replica). Tune: raise 2 if frequent deploys are normal.
        expr: sum(changes(safry_process_start_time_seconds[15m])) > 2
        labels:
          severity: page
        annotations:
          summary: "The API process keeps restarting"
          description: "The API process restarted more than 2 times in 15 minutes, which means it crashes soon after starting or on a request."
          first_action: "Read the API log right before each restart (the crash handler logs the error class and message length only); check the last deploy and roll back if it started with one. Then look for the request or job that triggers the crash."
          runbook: "docs/ALERTING.md#processrestarting"

      - alert: DatabaseUnreachable
        # /health/ready answers 503 "database" whenever SELECT 1 fails or takes over 2 seconds. Orchestrators probe it every few seconds,
        # so the counter keeps rising during an outage. Tune: raise "for" if brief failovers are normal.
        expr: sum(increase(safry_readiness_failures_total{reason="database"}[2m])) > 0
        for: 3m
        labels:
          severity: page
        annotations:
          summary: "The API cannot reach its database"
          description: "Readiness has failed because of the database for 3 minutes. Users cannot sign in or book; the API stays up but answers errors."
          first_action: "Check the database server status and connections in the cloud console; check for a failover, full storage, or a changed password or firewall rule. Do not restart the API first: it only waits for the database."
          runbook: "docs/ALERTING.md#databaseunreachable"

      - alert: ReadinessDown
        # Any readiness failure (database, or a replica stuck draining) that lasts. Short drains during a deploy are normal and stay below "for".
        # When DatabaseUnreachable also fires, route only that one (see inhibit_rules in deploy/alerts/alertmanager.dev.yml).
        expr: sum(increase(safry_readiness_failures_total[2m])) > 0
        for: 5m
        labels:
          severity: page
        annotations:
          summary: "The API reports not ready"
          description: "The readiness probe has been failing for 5 minutes (database problem or an instance stuck shutting down). Traffic may be failing."
          first_action: "Call /api/v1/health/ready on one instance to see which part is failing, then follow the database or deploy steps."
          runbook: "docs/ALERTING.md#readinessdown"

      - alert: High5xxRate
        # More than 5% server errors over 5 minutes, only when there is real traffic (above 0.1 request per second).
        # Tune: lower the ratio for a stricter service; lower the traffic floor if your site is very quiet.
        expr: |
          (
            sum(rate(safry_http_requests_total{status="5xx", route!~".*/(health/.*|metrics)"}[5m]))
            /
            sum(rate(safry_http_requests_total{route!~".*/(health/.*|metrics)"}[5m]))
          ) > 0.05
          and
          sum(rate(safry_http_requests_total{route!~".*/(health/.*|metrics)"}[5m])) > 0.1
        for: 10m
        labels:
          severity: page
        annotations:
          summary: "More than 5% of requests are failing with server errors"
          description: "For 10 minutes, over 5% of API requests ended in a 5xx error. Users are seeing failures."
          first_action: "Open the API logs for the last 15 minutes and group errors by route; check whether the last deploy or a database slowdown matches the start time."
          runbook: "docs/ALERTING.md#high5xxrate"

      - alert: HighLatencyP95
        # 95th percentile over 1 second for 10 minutes (histogram in milliseconds; the largest bucket is 10 s).
        # Tune: pick the p95 you see on a normal day and set the threshold at about 3 times that.
        expr: |
          histogram_quantile(0.95,
            sum by (le) (rate(safry_http_request_duration_ms_bucket{route!~".*/(health/.*|metrics)"}[5m]))
          ) > 1000
        for: 10m
        labels:
          severity: ticket
        annotations:
          summary: "The API is slow (p95 above 1 second)"
          description: "The slowest 5% of requests take more than 1 second, sustained for 10 minutes."
          first_action: "Check database CPU and connections, then the slowest routes in the API logs (durationMs); look for a heavy report or a missing index."
          runbook: "docs/ALERTING.md#highlatencyp95"

      - alert: RateLimitStoreDegraded
        # Redis for shared rate limits is down: limits still work per instance, but weaker with several instances.
        expr: max(safry_rate_limit_degraded) == 1
        for: 10m
        labels:
          severity: ticket
        annotations:
          summary: "Shared rate-limit store is down; limits are per instance"
          description: "The API fell back to in-process rate limits for 10 minutes. Protection against brute force is weaker while more than one instance runs."
          first_action: "Check the Redis service used by RATE_LIMIT_REDIS_URL and its network rules."
          runbook: "docs/ALERTING.md#ratelimitstoredegraded"

  - name: safry-security
    rules:
      - alert: LoginFailureSpike
        # Credential stuffing or brute force: at least 30 failed sign-ins in 10 minutes AND failures are over half of all sign-in attempts,
        # sustained for 5 minutes. The ratio avoids paging on a busy day with a few typos; the count avoids paging on one failed login at night.
        # Tune: 30 -> your normal daily peak of failures times 3; 0.5 -> lower for a stricter rule. Success = HTTP 2xx on the login route.
        expr: |
          (sum(increase(safry_login_failures_total[10m])) >= 30)
          and
          (
            sum(increase(safry_login_failures_total[10m]))
            /
            (
              sum(increase(safry_login_failures_total[10m]))
              + (sum(increase(safry_http_requests_total{route=~".*/auth/login", status="2xx"}[10m])) or vector(0))
            )
          ) > 0.5
        for: 5m
        labels:
          severity: page
        annotations:
          summary: "Many failed sign-ins: possible password guessing"
          description: "At least 30 sign-ins failed in 10 minutes and failures are over half of all attempts, for 5 minutes. This looks like credential stuffing or brute force."
          first_action: "Look at the failed-login audit events by address and reason; if one address range dominates, block it at the edge (Cloudflare or WAF rule). Check lockouts and 429s. Do not unlock accounts in bulk."
          runbook: "docs/ALERTING.md#loginfailurespike"

      - alert: LockoutSpike
        # Many accounts being locked means someone is guessing passwords across accounts. Tune: raise 10 for a large user base.
        expr: sum(increase(safry_account_lockouts_total[10m])) >= 10
        for: 5m
        labels:
          severity: ticket
        annotations:
          summary: "Many accounts were locked after failed sign-ins"
          description: "At least 10 sign-in blocks started in 10 minutes. Real users rarely lock themselves out this often."
          first_action: "Check which reasons dominate the failed logins and whether the addresses are shared; support may get calls from locked real users."
          runbook: "docs/ALERTING.md#lockoutspike"

      - alert: RateLimit429Spike
        # More than 100 requests refused by the rate limiter in 10 minutes, per route group (auth routes vs the rest).
        # Tune: raise if a legitimate office or partner shares one address.
        expr: sum by (group) (increase(safry_rate_limited_total[10m])) > 100
        for: 5m
        labels:
          severity: ticket
        annotations:
          summary: "The rate limiter is rejecting many requests ({{ $labels.group }} routes)"
          description: "More than 100 requests were refused with HTTP 429 in 10 minutes for the {{ $labels.group }} routes. Either an attack is being absorbed or a real client is misbehaving."
          first_action: "Find the busiest client address in the edge or API logs; block it if hostile, or fix the client if it is a partner or our own front end."
          runbook: "docs/ALERTING.md#ratelimit429spike"

      - alert: RefreshReuseDetected
        # Any reuse of an already-rotated refresh token after the short grace window: a copied or stolen session token. The whole session family is revoked.
        # Severity ticket; raise to page if you serve high-value accounts.
        expr: sum(increase(safry_refresh_reuse_detected_total[10m])) > 0
        labels:
          severity: ticket
        annotations:
          summary: "A refresh token was replayed (possible session theft)"
          description: "A session token that had already been used was presented again. The session family was revoked automatically; the user has been signed out."
          first_action: "Find the session-reuse audit events (user, address, time). Ask the user to change their password if the address is not theirs."
          runbook: "docs/ALERTING.md#refreshreusedetected"

      - alert: PlatformAdminSignIn
        # Informational: every platform-administrator sign-in. Route to a ticket or chat channel, not to a phone.
        expr: sum(increase(safry_platform_admin_signins_total[10m])) > 0
        labels:
          severity: ticket
        annotations:
          summary: "A platform administrator signed in"
          description: "A platform-administrator account completed a sign-in in the last 10 minutes."
          first_action: "Nothing if expected. If nobody on the admin list signed in, treat it as account takeover: revoke sessions and rotate the password."
          runbook: "docs/ALERTING.md#platformadminsignin"

      - alert: PlatformAdminSignInOffHours
        # Same signal outside working hours; hour() is UTC. Adjust 6 and 20 to your team day (Cairo is UTC+2 or +3).
        expr: sum(increase(safry_platform_admin_signins_total[10m])) > 0 and on() (hour() < 6 or hour() >= 20)
        labels:
          severity: page
        annotations:
          summary: "A platform administrator signed in outside working hours"
          description: "A platform-administrator sign-in happened between 20:00 and 06:00 UTC."
          first_action: "Confirm with the admin team right away. If nobody signed in, revoke the admin sessions and rotate the password."
          runbook: "docs/ALERTING.md#platformadminsigninoffhours"

      - alert: MfaResetPerformed
        # The break-glass script (backend/scripts/reset-platform-admin-mfa.ts) writes an audit event; the API reports the count of the last 24 hours.
        # It stays firing for 24 hours after a reset by design: acknowledge it, it clears itself.
        expr: max(safry_platform_admin_mfa_resets_24h) > 0
        labels:
          severity: page
        annotations:
          summary: "A platform administrator second factor was reset (break-glass)"
          description: "The emergency script removed an administrator MFA in the last 24 hours."
          first_action: "Confirm there is a ticket with the operator and approver names for it (they are in the audit event). If there is none, treat it as an incident."
          runbook: "docs/ALERTING.md#mfaresetperformed"

  - name: safry-mail
    rules:
      - alert: MailBudgetExhausted
        # The API dropped mail because a mail pool (hourly or daily limit) was spent. Two pools matter and the pool label tells them apart:
        #   registration = verification mail for NEW sign-ups (MAIL_BUDGET_REGISTRATION_PER_HOUR / _PER_DAY): real growth, or a sign-up flood.
        #   reset        = reset and resend mail for EXISTING accounts (MAIL_BUDGET_RESET_PER_HOUR / _PER_DAY): real users cannot recover access.
        # The security pool (owner notices) is left out on purpose. Tune: raise "for" if brief spikes are normal; raise a pool when the mail plan allows more.
        expr: sum by (pool) (increase(safry_mail_budget_exhausted_total{pool=~"registration|reset"}[15m])) > 0
        for: 5m
        labels:
          severity: ticket
        annotations:
          summary: "The {{ $labels.pool }} mail pool is spent; its mail is being dropped"
          description: "Mail of the {{ $labels.pool }} pool was refused by its hourly or daily limit for at least 5 minutes. registration = verification mail for new sign-ups; reset = reset and resend mail for existing accounts, so real users may not receive a link until the window resets."
          first_action: "Check the registration and forgot-password rate in the logs by client address; block an abusive range at the edge. If the traffic is real, raise the limits of that pool (MAIL_BUDGET_<POOL>_PER_HOUR and _PER_DAY) within your mail plan. A reset pool that is spent while the registration pool is not points at forgot or resend abuse."
          runbook: "docs/ALERTING.md#mailbudgetexhausted"

      - alert: MailFailureRate
        # At least 3 mails permanently failed in 30 minutes and they are over a quarter of all mail. Mail carries password resets and verification links.
        # Tune: raise 3 if you send a lot of mail.
        expr: |
          (sum(increase(safry_mail_delivery_total{outcome="failed"}[30m])) >= 3)
          and
          (
            sum(increase(safry_mail_delivery_total{outcome="failed"}[30m]))
            /
            sum(increase(safry_mail_delivery_total[30m]))
          ) > 0.25
        for: 10m
        labels:
          severity: ticket
        annotations:
          summary: "Outgoing e-mail is failing"
          description: "Password-reset and verification mails are not being delivered (at least 3 failures in 30 minutes, over 25% of attempts)."
          first_action: "Check the mail provider status page and the API key; look at the API log lines 'mail ... not delivered' for the provider answer."
          runbook: "docs/ALERTING.md#mailfailurerate"

  - name: safry-storage
    rules:
      - alert: PurgeJobStale
        # The daily retention job (backend/scripts/db/purge.sh, compose service "maintenance") writes a heartbeat after every successful run; the API exports it.
        # A migration seeds a baseline, so a job that never ran is stale 36 hours after the deploy. 129600 s = 36 h. Omitted while the database is down (DatabaseUnreachable covers that).
        expr: (time() - max(safry_maintenance_last_success_timestamp_seconds)) > 129600
        for: 10m
        labels:
          severity: ticket
        annotations:
          summary: "The daily retention job has not succeeded for 36 hours"
          description: "Sessions, reset links, sign-in counters and audit events are not being purged, expired bookings are not being cancelled and audit partitions are not being created ahead."
          first_action: "Run 'docker compose logs --tail 100 maintenance' (or the scheduler job log) and fix the error shown; then 'docker compose restart maintenance' to run it now. Make sure the maintenance service is up: 'docker compose ps maintenance'."
          runbook: "docs/ALERTING.md#purgejobstale"

      - alert: StorageSignalsMissing
        # The four storage alerts below and PurgeJobStale are silent when their gauges are missing, so this one watches the gauges themselves:
        # the heartbeat series is absent, or reading it failed (safry_storage_signal_errors_total grew) for 6 hours. Also fires if the API stays unreachable (ApiDown pages first).
        expr: absent(safry_maintenance_last_success_timestamp_seconds) or (sum(increase(safry_storage_signal_errors_total[30m])) > 0)
        for: 6h
        labels:
          severity: ticket
        annotations:
          summary: "Storage-health gauges are missing, so the retention alerts cannot fire"
          description: "For 6 hours the API has not exported the retention heartbeat (database read failing, or the metrics scrape itself missing). PurgeJobStale, AuditDefaultPartitionHasRows, RefreshSessionsPastRetention and TableDeadTuplesHigh are blind meanwhile."
          first_action: "Check ApiDown and DatabaseUnreachable first. If both are quiet, read the API log for the failing read and check that the runtime login can execute audit_default_partition_rows() and read maintenance_runs (migration 20261019_retention_maintenance)."
          runbook: "docs/ALERTING.md#storagesignalsmissing"

      - alert: AuditDefaultPartitionHasRows
        # audit_events_default only receives rows that fit no monthly partition: the job that creates partitions ahead has stopped for longer than the months kept ready (default 6, the migration made 12).
        expr: max(safry_audit_default_partition_rows) > 0
        for: 30m
        labels:
          severity: ticket
        annotations:
          summary: "Audit events are landing in the safety-net partition"
          description: "audit_events_default holds rows, so a month has no partition of its own and those rows are never purged by age until the partition exists."
          first_action: "Run the maintenance job now ('docker compose restart maintenance'); it creates the missing months and moves the rows. If it keeps failing, run CALL ensure_audit_event_partitions(0, 6) as the database owner."
          runbook: "docs/ALERTING.md#auditdefaultpartitionhasrows"

      - alert: RefreshSessionsPastRetention
        # 1 when some refresh session expired or was revoked more than SESSION_RETENTION_DAYS + 3 days ago (default 30 + 3), so the purge is not keeping up.
        expr: max(safry_refresh_sessions_overdue) > 0
        for: 6h
        labels:
          severity: ticket
        annotations:
          summary: "Refresh sessions older than their retention are still stored"
          description: "At least one refresh session is more than 3 days older than the retention (default 30 days after expiry); the purge is not running or not keeping up, and the table keeps growing."
          first_action: "Check PurgeJobStale and the maintenance log. If the job runs but the sessions remain, a long transaction may block the delete: look at pg_stat_activity, then run CALL purge_refresh_sessions(interval '30 days') as the owner."
          runbook: "docs/ALERTING.md#refreshsessionspastretention"

      - alert: ErasurePastRetention
        # 1 when an account deleted more than ANONYMISE_DELETED_USERS_AFTER_DAYS + 3 days ago still holds personal data, or an audit row older than AUDIT_IP_RETENTION_DAYS + 3 days still holds an IP address. A setting of 0 turns that half off.
        expr: max(safry_erasure_overdue) > 0
        for: 6h
        labels:
          severity: ticket
        annotations:
          summary: "Personal data is kept longer than the retention settings allow"
          description: "The maintenance job's erasure steps (anonymise deleted accounts, clear audit IP addresses) are behind by more than 3 days."
          first_action: "Check PurgeJobStale and the maintenance log ('docker compose logs --tail 100 maintenance'). Count what is pending with 'docker compose run --rm -e PURGE_DRY_RUN=1 --entrypoint sh maintenance /scripts/purge.sh'."
          runbook: "docs/ALERTING.md#erasurepastretention"

      - alert: BackupMissing
        # The backup job writes backup-metrics.prom into the backup volume (textfile collector, see docs/ALERTING.md). The newest dump is older than 36 hours (daily schedule + 12 h slack).
        expr: (time() - max(safry_backup_last_success_timestamp_seconds)) > 36 * 3600
        for: 15m
        labels:
          severity: page
        annotations:
          summary: "No database backup for 36 hours"
          description: "The newest dump in the backup volume is older than 36 hours: the backup service is not running, failing, or the volume is full."
          first_action: "Run 'docker compose ps backup' and 'docker compose logs --tail 100 backup'. A full volume: raise BACKUP_MAX_TOTAL_MB or free the disk, then 'docker compose restart backup'."
          runbook: "docs/ALERTING.md#backupmissing"

      - alert: BackupVolumeNearlyFull
        # Either the disk holding the backup volume is over 85% used, or the backups use over 90% of BACKUP_MAX_TOTAL_MB (the oldest are then deleted, so the cap is about to bite).
        expr: |
          max(safry_backup_volume_used_percent) > 85
          or
          (max(safry_backup_cap_bytes) > 0 and max(safry_backup_total_bytes) / max(safry_backup_cap_bytes) > 0.9)
        for: 30m
        labels:
          severity: ticket
        annotations:
          summary: "The backup volume is nearly full"
          description: "The disk of the backup volume is over 85% used, or the dumps use over 90% of BACKUP_MAX_TOTAL_MB. The next dump may fail or push the oldest ones out."
          first_action: "Copy the dumps off the host, raise BACKUP_MAX_TOTAL_MB or the disk, or lower BACKUP_KEEP_DAYS."
          runbook: "docs/ALERTING.md#backupvolumenearlyfull"

      - alert: TableDeadTuplesHigh
        # Dead rows (deleted, not yet vacuumed) over 100000 AND over 30% of the table for 2 hours: autovacuum is blocked (long transaction, replication slot) or cannot keep up.
        # Migration 20261019_retention_maintenance lowers the autovacuum threshold of the churn tables to about 2%, so this should be rare. Tune: raise 100000 for larger tables.
        expr: |
          (max by (table) (safry_table_dead_tuples) > 100000)
          and
          (
            max by (table) (safry_table_dead_tuples)
            /
            (max by (table) (safry_table_dead_tuples) + max by (table) (safry_table_live_tuples))
          ) > 0.3
        for: 2h
        labels:
          severity: ticket
        annotations:
          summary: "Table {{ $labels.table }} is mostly dead rows"
          description: "More than 100000 rows of {{ $labels.table }} are deleted but not yet reclaimed (over 30% of the table); disk use grows and queries slow down."
          first_action: "Look for a long-running transaction or a stale replication slot (pg_stat_activity, pg_replication_slots), then run VACUUM (ANALYZE) on the table as the owner. Docs: backend/docs/database-operations.md, 'Disk space after a purge'."
          runbook: "docs/ALERTING.md#tabledeadtupleshigh"
