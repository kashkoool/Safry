allowBuilds:
  "@embedded-postgres/darwin-arm64": true
  "@embedded-postgres/darwin-x64": true
  "@embedded-postgres/linux-arm64": true
  "@embedded-postgres/linux-x64": true
  "@embedded-postgres/windows-x64": true
  "@prisma/engines": true
  "@scarf/scarf": false
  argon2: true
  esbuild: true
  prisma: true
confirmModulesPurge: false
# Refuse versions published in the last 3 days (minutes), so a freshly pushed malicious release is not picked up by an update.
minimumReleaseAge: 4320
