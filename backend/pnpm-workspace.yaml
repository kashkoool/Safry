allowBuilds:
  "@embedded-postgres/darwin-arm64": true
  "@embedded-postgres/darwin-x64": true
  "@embedded-postgres/linux-arm64": true
  "@embedded-postgres/linux-x64": true
  "@embedded-postgres/windows-x64": true
  "@prisma/engines": true
  "@scarf/scarf": false
  argon2: true
  esbuild: true
  prisma: true
confirmModulesPurge: false
# Refuse versions published in the last 3 days (minutes), so a freshly pushed malicious release is not picked up by an update.
minimumReleaseAge: 4320
# Security overrides for transitive dependencies of the Prisma CLI chain. Remove each one when the Prisma release in use
# resolves a patched version on its own (check with `pnpm why <name>`).
overrides:
  # prisma > @prisma/config pins deepmerge-ts 7.1.5; patched in 8.0.0.
  deepmerge-ts: 8.0.2
  # prisma > mysql2 (unused MySQL tooling, PostgreSQL only); patched in 3.22.0 and 3.23.1.
  mysql2: 3.23.4
  # vitest 5.0.3 > vite (test tooling only); advisory CVE-2026-112942 fixed in 8.3.3 (also 8.2.4, 8.1.6, 7.3.7).
  # Remove when vitest resolves a patched vite on its own (check with `pnpm why vite`).
  vite: ^8.3.3
