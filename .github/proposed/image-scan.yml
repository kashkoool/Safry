# PROPOSED workflow (not active): move to .github/workflows/ after review.
# Builds the production images, writes a CycloneDX SBOM for each, and fails on fixable
# HIGH/CRITICAL vulnerabilities. Uses the official Trivy image pinned by digest (no third-party action).
# Also proposed: lower the docker-size-budget.yml api cap. Measured 2026-10-07 on fix/infra:
#   api 442,143,882 B (was 1,103,889,050 B), web 90,789,455 B.
name: Image scan and SBOM

on:
  pull_request:
    paths:
      - "backend/**"
      - "frontend/**"
      - "docker-compose.yml"
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1" # weekly: new CVEs appear without code changes

permissions:
  contents: read

concurrency:
  group: image-scan-${{ github.ref }}
  cancel-in-progress: true

env:
  TRIVY_IMAGE: aquasec/trivy:0.75.0@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa

jobs:
  scan:
    name: ${{ matrix.name }} image
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: api, context: backend, target: runtime }
          - { name: migrate, context: backend, target: migrate }
          - { name: web, context: frontend, target: "" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build
        run: docker build ${{ matrix.target && format('--target {0}', matrix.target) || '' }} -t "safry-${{ matrix.name }}:scan" "${{ matrix.context }}"
      - name: SBOM (CycloneDX)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "$TRIVY_IMAGE" \
            image --quiet --format cyclonedx "safry-${{ matrix.name }}:scan" > "sbom-${{ matrix.name }}.cdx.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1 (same pin as scorecard.yml)
        with:
          name: sbom-${{ matrix.name }}
          path: sbom-${{ matrix.name }}.cdx.json
      - name: Vulnerabilities (fail on fixable HIGH/CRITICAL; the migrate image only reports)
        run: |
          exit_code=1
          [ "${{ matrix.name }}" = "migrate" ] && exit_code=0
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "$TRIVY_IMAGE" \
            image --quiet --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed \
            --exit-code "$exit_code" "safry-${{ matrix.name }}:scan"
