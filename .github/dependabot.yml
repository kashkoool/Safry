version: 2
# Major version updates are never proposed automatically: they are planned upgrades (changelog read, migration done,
# tests adjusted). Minor and patch updates, and GitHub Actions, keep flowing as before.
updates:
  - package-ecosystem: "npm"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps)"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      backend-minor-and-patch:
        update-types: ["minor", "patch"]
        # Auth, session, validation, database and HTTP-hardening libraries are NOT bundled: each one gets its own
        # pull request so it is read on its own before merging.
        exclude-patterns:
          - "argon2"
          - "helmet"
          - "@nestjs/jwt"
          - "@nestjs/passport"
          - "passport*"
          - "@nestjs/throttler"
          - "class-validator"
          - "class-transformer"
          - "@prisma/*"
          - "prisma"
          - "pg"
          - "ioredis"
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps)"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      frontend-minor-and-patch:
        update-types: ["minor", "patch"]
  # Exact pnpm version used by the Dockerfiles (installed with npm ci from these lockfiles).
  - package-ecosystem: "npm"
    directories: ["/backend/tools/pnpm", "/frontend/tools/pnpm"]
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "chore(deps)"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "chore(actions)"
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: "docker"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    # No grouping for Docker: each base-image bump is its own pull request, so the image and version are visible
    # in the title and a Node or database version change cannot hide inside a combined update.
  - package-ecosystem: "docker"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    # No grouping for Docker: each base-image bump is its own pull request, so the image and version are visible
    # in the title and a Node or database version change cannot hide inside a combined update.
  # Root compose images (postgres, caddy): tracks upstream rebuilds that drop the gosu/Go-stdlib findings.
  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "chore(deps)"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      compose-images:
        patterns: ["*"]
