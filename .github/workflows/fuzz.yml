name: Fuzz

# Property-based tests (fast-check) over parsers and validators that handle untrusted input, run with many more cases than the
# unit suite. A failure prints the seed and the shrunk counterexample.
on:
  pull_request:
    paths:
      - "backend/src/common/**"
      - "backend/src/config/**"
      - "backend/src/modules/mail/**"
      - ".github/workflows/fuzz.yml"
  schedule:
    - cron: "0 5 * * 3"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  fuzz:
    name: Property-based fuzzing
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    env:
      FUZZ_RUNS: "20000"
      # Throwaway value only used to generate the Prisma client; nothing connects to it.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci?schema=public
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma client
        run: pnpm prisma:generate
      - name: Run property tests
        run: pnpm exec vitest run src/common/fuzz.spec.ts
