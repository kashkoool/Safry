# Lighthouse CI against the built frontend (median of 3 runs on the sign-in page).
# Budgets live in frontend/lighthouserc.json: performance >= 0.9, accessibility >= 0.95, best-practices >= 0.9.
# Reports stay in the job's artifacts; nothing is uploaded to an external service and no secrets are involved.
name: Lighthouse

on:
  pull_request:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/lighthouse.yml"
  schedule:
    - cron: "43 4 * * 1" # weekly

permissions:
  contents: read

concurrency:
  group: lighthouse-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 22
  PNPM_VERSION: 11

jobs:
  lighthouse:
    name: Lighthouse (performance, accessibility, best practices)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # "lighthouse" builds, serves `vite preview` and runs `lhci autorun` with the Chrome installed on the runner.
      - name: Lighthouse CI
        run: pnpm lighthouse
      - name: Upload the reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lighthouse-reports
          path: frontend/.lighthouseci
          retention-days: 14
          if-no-files-found: ignore
