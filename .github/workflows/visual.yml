# Visual regression: Playwright screenshots of key pages (login, account, platform accounts list; English and Arabic/RTL)
# with a fully mocked API, taken in the same Playwright container image everywhere so the PNGs are byte-stable.
# Not a required check. To accept an intended change: frontend/scripts/visual-snapshots.sh --update, review, commit
# (see docs/CI.md, "Visual regression"). Keep the image tag equal to "@playwright/test" in frontend/package.json.
name: Visual regression

on:
  pull_request:
    paths:
      - "frontend/src/**"
      - "frontend/package.json"
      - "frontend/pnpm-lock.yaml"
      - "frontend/e2e/visual.shot.ts"
      - "frontend/e2e/__screenshots__/**"
      - "frontend/playwright.config.ts"
      - ".github/workflows/visual.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: visual-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PNPM_VERSION: 11

jobs:
  visual:
    name: Screenshots (Chromium, Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble@sha256:06a9939e57531807f8d5fd76ce44b53165ffb7d7501d87ab10e285c20b1e971f
      options: --ipc=host
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Compare screenshots
        env:
          E2E_PROJECTS: visual
          CI: "1"
        run: pnpm exec playwright test
      # Only on failure: expected, actual and diff images.
      - name: Upload the diffs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: visual-diffs
          path: |
            frontend/test-results
            frontend/playwright-report
          retention-days: 7
          if-no-files-found: ignore
