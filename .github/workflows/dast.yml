# DAST: OWASP ZAP baseline (passive: spiders and observes, sends no attack traffic) against a throwaway stack built in the job
# (real API + PostgreSQL 17 + the production nginx image). Fails on any new alert of risk Medium or higher
# (scripts/dast-check.mjs); ignored rules and reasons are in .zap/rules.tsv. Not a required check. The ZAP ACTIVE scan
# is never run here: it sends attack traffic and creates junk data, so it is for a staging copy only (docs/CI.md).
# The report is uploaded as an artifact (no write permission needed). Local run: scripts/dast-local.sh
name: DAST (ZAP baseline)

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 3" # weekly
  pull_request:
    paths:
      - "frontend/nginx.conf"
      - "frontend/nginx/**"
      - "frontend/Dockerfile"
      - "backend/src/app.setup.ts"
      - "backend/src/common/security/**"
      - "backend/src/modules/identity/auth/**"
      - ".zap/**"
      - "scripts/dast-check.mjs"
      - ".github/workflows/dast.yml"

permissions:
  contents: read

concurrency:
  group: dast-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 22
  PNPM_VERSION: 11
  # Pinned by version and digest; keep equal to scripts/dast-local.sh.
  ZAP_IMAGE: ghcr.io/zaproxy/zaproxy:2.17.0@sha256:7aaa659b0d43078febd82e29bad112285c370727e86ab8340444220e17d9f0d2

jobs:
  zap-baseline:
    name: ZAP baseline (passive) against a throwaway stack
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Throwaway CI database: the demo seed is acceptable here only because nothing outlives this job.
    # PostgreSQL superuser is used for migrations and the seed; the API connects as the restricted runtime login.
    services:
      postgres:
        image: postgres:17.11-alpine
        env:
          POSTGRES_PASSWORD: ci-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      MIGRATE_URL: postgresql://postgres:ci-test-only@127.0.0.1:5432/postgres?schema=public
      RUNTIME_PASSWORD: ci-runtime-only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: |
            backend/pnpm-lock.yaml
            frontend/pnpm-lock.yaml
      - name: Per-run passwords for the throwaway database
        run: |
          for name in DEMO_SEED_PASSWORD BOOTSTRAP_ADMIN_PASSWORD JWT_ACCESS_SECRET; do
            value="$(openssl rand -hex 24)"
            echo "::add-mask::$value"
            echo "$name=$value" >> "$GITHUB_ENV"
          done
      - name: Build the API, migrate, create the runtime login, seed
        working-directory: backend
        run: |
          pnpm install --frozen-lockfile
          pnpm prisma:generate
          pnpm build
          DATABASE_URL="$MIGRATE_URL" pnpm db:deploy
          docker run --rm --network host -v "$PWD/scripts/db:/sql:ro" postgres:17.11-alpine             psql "postgresql://postgres:ci-test-only@127.0.0.1:5432/postgres" -v runtime_password="$RUNTIME_PASSWORD" -f /sql/create-runtime-role.sql
          DATABASE_URL="$MIGRATE_URL" NODE_ENV=development pnpm db:seed
      - name: Start the API (restricted runtime login, port 3000)
        working-directory: backend
        env:
          NODE_ENV: development
          PORT: "3000"
          DATABASE_URL: postgresql://safry_runtime:ci-runtime-only@127.0.0.1:5432/postgres?schema=public
          DATABASE_MIGRATE_URL: postgresql://postgres:ci-test-only@127.0.0.1:5432/postgres?schema=public
          CORS_ORIGINS: http://127.0.0.1:8080
          # Console mail transport: the emailed links are logged, and the credential journeys read them from api.log.
          MAIL_TRANSPORT: console
        run: |
          nohup node dist/main.js > "$RUNNER_TEMP/api.log" 2>&1 &
          for _ in $(seq 1 30); do
            curl -fsS http://127.0.0.1:3000/api/v1/health/ready && exit 0
            sleep 2
          done
          # Console mail transport logs emailed links: print only a filtered tail, never the raw log.
          tail -n 40 "$RUNNER_TEMP/api.log" | grep -viE 'mail|http[s]?://|token|password|link' || true
          exit 1
      # The production web image (nginx with the real CSP and security headers) proxies /api to host port 3000 as "api".
      - name: Build and start the web image
        run: |
          docker build -t safry-web:dast frontend
          docker run -d --name safry-web-dast -p 127.0.0.1:8080:8080 --add-host api:host-gateway safry-web:dast
          for _ in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8080/healthz && exit 0
            sleep 2
          done
          docker logs safry-web-dast
          exit 1
      - name: ZAP baseline (passive)
        run: |
          mkdir -p "$RUNNER_TEMP/zap"
          cp .zap/rules.tsv "$RUNNER_TEMP/zap/rules.tsv"
          chmod 777 "$RUNNER_TEMP/zap"
          rc=0
          docker run --rm --network host -v "$RUNNER_TEMP/zap":/zap/wrk:rw "$ZAP_IMAGE"             zap-baseline.py -t http://127.0.0.1:8080 -c rules.tsv -J report.json -r report.html -I -m 3 || rc=$?
          # 0/1/2 are scan results (the gate below decides); anything else means ZAP itself failed.
          test "$rc" -le 2
      - name: Gate (Medium or higher fails)
        run: |
          set -o pipefail
          node scripts/dast-check.mjs "$RUNNER_TEMP/zap/report.json" | tee "$RUNNER_TEMP/dast-summary.md"
          { echo "### ZAP baseline"; echo; cat "$RUNNER_TEMP/dast-summary.md"; } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the ZAP report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: zap-report
          path: |
            ${{ runner.temp }}/zap/report.html
            ${{ runner.temp }}/zap/report.json
          retention-days: 14
          if-no-files-found: ignore
