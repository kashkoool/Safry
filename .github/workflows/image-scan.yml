# Builds the three production images and scans them with Trivy: the build fails on any fixable HIGH or CRITICAL
# vulnerability. Findings go to the repository's code scanning alerts as SARIF (skipped for pull requests from forks, which cannot write alerts), and a CycloneDX SBOM is kept as an artifact.
# Known, reviewed exceptions live in .trivyignore (each with an expiry date).
name: Image scan and SBOM

on:
  # Runs on every pull request to main (no path filter) so it can be a required check.
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1" # weekly: new advisories appear without code changes

permissions:
  contents: read

concurrency:
  group: image-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: Image scan (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      security-events: write # upload SARIF to code scanning
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: api, context: backend, target: runtime }
          - { name: migrate, context: backend, target: migrate }
          - { name: web, context: frontend, target: "" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build
        env:
          TARGET: ${{ matrix.target }}
          CONTEXT: ${{ matrix.context }}
          NAME: ${{ matrix.name }}
        run: |
          if [ -n "$TARGET" ]; then
            docker build --target "$TARGET" -t "safry-$NAME:scan" "$CONTEXT"
          else
            docker build -t "safry-$NAME:scan" "$CONTEXT"
          fi
      - name: SBOM (CycloneDX)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.75.0
          image-ref: safry-${{ matrix.name }}:scan
          format: cyclonedx
          output: sbom-${{ matrix.name }}.cdx.json
          scan-type: image
          exit-code: "0"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-${{ matrix.name }}
          path: sbom-${{ matrix.name }}.cdx.json
          retention-days: 30
      # Fails the job on a fixable HIGH or CRITICAL finding that is not listed in .trivyignore.
      - name: Vulnerability scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.75.0
          image-ref: safry-${{ matrix.name }}:scan
          scan-type: image
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          trivyignores: .trivyignore
          exit-code: "1"
          format: sarif
          output: trivy-${{ matrix.name }}.sarif
          limit-severities-for-sarif: true
      # Forks cannot write code scanning results; the scan step above still gates the pull request.
      - name: Upload SARIF to code scanning
        if: ${{ !cancelled() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork != true) && hashFiles(format('trivy-{0}.sarif', matrix.name)) != '' }}
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: trivy-${{ matrix.name }}.sarif
          category: trivy-${{ matrix.name }}
