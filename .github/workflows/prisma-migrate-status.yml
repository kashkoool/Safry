# Applies every migration to a fresh PostgreSQL and fails if the schema drifts from prisma/schema.prisma.
name: prisma-migrate-status

on:
  pull_request:
    paths:
      - "backend/prisma/**"
      - "backend/prisma7.config.ts"
      - "backend/package.json"
      - ".github/workflows/prisma-migrate-status.yml"
  push:
    branches: [main]
    paths:
      - "backend/prisma/**"
      - "backend/prisma7.config.ts"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: prisma-migrate-status-${{ github.ref }}
  cancel-in-progress: true

jobs:
  migrate-status:
    name: Fresh-database migrate + drift check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: safry_ci
          POSTGRES_USER: ci
          # Throwaway password for an ephemeral service container that is destroyed with the job.
          POSTGRES_PASSWORD: ci-only-ephemeral
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d safry_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://ci:ci-only-ephemeral@localhost:5432/safry_ci?schema=public
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Apply all migrations to the fresh database
        run: pnpm db:deploy
      - name: Migration status (must report the database schema is up to date)
        run: pnpm exec prisma migrate status
      # --exit-code fails when the migrated database differs from the Prisma schema (exit 2).
      # Known baseline drift exists (updatedAt default, one FK name), so this step
      # is reported but not blocking. Remove continue-on-error once the drift is fixed by a new migration.
      - name: Drift check (migrations vs schema.prisma)
        continue-on-error: true
        run: pnpm exec prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code
