# Cross-browser run: the mocked (no real API) Playwright specs in Firefox and WebKit. Never runs per pull request, so
# pull-request CI time is unchanged; pull-request CI keeps running Chromium against the real stack. Manual and weekly.
# Not a required check. Locally: cd frontend && E2E_PROJECTS=browsers pnpm exec playwright test
name: Cross-browser E2E

on:
  workflow_dispatch:
  schedule:
    - cron: "47 4 * * 2" # weekly

permissions:
  contents: read

concurrency:
  group: e2e-browsers-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 22
  PNPM_VERSION: 11

jobs:
  browsers:
    name: Firefox and WebKit (mocked specs)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install dependencies and the browsers
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps firefox webkit
      # The config skips the specs that need the real API (see needsRealStack in playwright.config.ts); the rest mock /api.
      - name: Playwright (Firefox, WebKit)
        env:
          E2E_PROJECTS: browsers
        run: pnpm exec playwright test
      - name: Upload the Playwright report and traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-browsers
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7
          if-no-files-found: ignore
