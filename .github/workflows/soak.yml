# Soak test: the real API and PostgreSQL 17 at a low constant rate (default 30 min, 20 requests/s) watching latency drift and
# API memory growth. Manual only (never per pull request, no schedule). Not a required check. See backend/test/load/README.md.
name: Soak test

on:
  workflow_dispatch:
    inputs:
      minutes:
        description: "Length of the run in minutes"
        required: false
        default: "30"
      rate:
        description: "Requests per second"
        required: false
        default: "20"

permissions:
  contents: read

concurrency:
  group: soak-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: 22
  PNPM_VERSION: 11

jobs:
  soak:
    name: Soak (low constant rate)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Throwaway test-only credentials for an ephemeral container that lives for this job only.
    services:
      postgres:
        image: postgres:17.11-alpine
        env:
          POSTGRES_PASSWORD: ci-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      MIGRATE_URL: postgresql://postgres:ci-test-only@127.0.0.1:5432/postgres?schema=public
      RUNTIME_URL: postgresql://safry_runtime:ci-runtime-only@127.0.0.1:5432/postgres?schema=public
      MINUTES: ${{ github.event.inputs.minutes || '30' }}
      RATE: ${{ github.event.inputs.rate || '20' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml
      - name: Per-run signing secret
        run: |
          value="$(openssl rand -hex 32)"
          echo "::add-mask::$value"
          echo "LOAD_JWT_SECRET=$value" >> "$GITHUB_ENV"
      - name: Build the API, migrate, create the runtime login
        working-directory: backend
        run: |
          pnpm install --frozen-lockfile
          pnpm prisma:generate
          pnpm build
          DATABASE_URL="$MIGRATE_URL" pnpm db:deploy
          docker run --rm --network host -v "$PWD/scripts/db:/sql:ro" postgres:17.11-alpine \
            psql "postgresql://postgres:ci-test-only@127.0.0.1:5432/postgres" -v runtime_password=ci-runtime-only -f /sql/create-runtime-role.sql
      - name: Install the load tooling and seed the reduced dataset
        working-directory: backend/test/load
        env:
          LOAD_DATABASE_URL: postgresql://postgres:ci-test-only@127.0.0.1:5432/postgres
          LOAD_TENANTS: "2"
          LOAD_TRAVELERS_PER_TENANT: "300"
          LOAD_ORGS_PER_TENANT: "5"
          LOAD_SERVICES_PER_ORG: "10"
          LOAD_BOOKINGS_PER_TENANT: "2000"
          LOAD_HOT_BOOKINGS: "500"
          LOAD_TOKENS_PER_TENANT: "100"
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          node seed.mjs
      - name: Start the API (restricted runtime login)
        working-directory: backend
        env:
          LOAD_DATABASE_URL: ${{ env.RUNTIME_URL }}
          PORT: "3100"
        run: |
          nohup bash test/load/start-api.sh > "$RUNNER_TEMP/api.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/api.pid"
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:3100/api/v1/health/ready && exit 0
            sleep 2
          done
          cat "$RUNNER_TEMP/api.log"
          exit 1
      - name: Soak
        working-directory: backend/test/load
        run: |
          set -o pipefail
          node soak.mjs --url http://127.0.0.1:3100 --minutes "$MINUTES" --rate "$RATE" --pid "$(cat "$RUNNER_TEMP/api.pid")" --label ci | tee "$RUNNER_TEMP/soak.log"
      - name: Summary
        if: always()
        run: |
          {
            echo "### Soak (${MINUTES} min, ${RATE} req/s)"
            echo
            tail -n 3 "$RUNNER_TEMP/soak.log" || true
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the raw results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: soak-results
          path: backend/test/load/.data/soak-ci.json
          retention-days: 30
          if-no-files-found: ignore
